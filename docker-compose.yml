services:
  postgres:
    # 로컬 개발과 Flyway smoke test에서 사용할 PostgreSQL 컨테이너입니다.
    # PostgreSQL 16은 프로젝트 요구사항인 PostgreSQL 14+를 만족하는 안정 버전입니다.
    image: postgres:16-alpine

    # docker exec, docker ps에서 찾기 쉽도록 컨테이너 이름을 고정합니다.
    container_name: postgres

    # 개발 중 Docker가 재시작되어도 DB 컨테이너가 자동으로 다시 올라오게 합니다.
    restart: unless-stopped

    # 호스트 포트는 .env의 POSTGRES_PORT로 바꿀 수 있습니다.
    # 로컬 PC에서 이미 5432를 쓰고 있으면 POSTGRES_PORT=15432처럼 변경하면 됩니다.
    ports:
      - "${POSTGRES_PORT:-5432}:5432"

    environment:
      # 실제 DB 이름, 계정, 비밀번호는 .env에서 주입합니다.
      # docker-compose.yml에 비밀번호를 직접 쓰면 Git에 노출될 수 있으므로 금지합니다.
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set in .env}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      TZ: Asia/Seoul

    volumes:
      # 컨테이너를 삭제하거나 다시 만들어도 DB 데이터가 유지되도록 named volume을 사용합니다.
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      # PostgreSQL이 실제 연결을 받을 수 있는 상태인지 확인합니다.
      # Spring Boot나 smoke test를 실행하기 전에 DB 준비 상태를 판단하는 기준입니다.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  # PostgreSQL 데이터 파일을 보관하는 Docker named volume입니다.
  postgres_data:
