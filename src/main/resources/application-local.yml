# ============================================================================
# ⚠️  이 파일은 Git에 트래킹됩니다. 실제 비밀번호·API Key를 절대 적지 마세요.
#     모든 비밀값은 ${ENV_VAR:} 형태의 환경변수 placeholder로만 두고,
#     실제 값은 .env 또는 IntelliJ Run Configuration에서 주입합니다.
#     실값을 박아 커밋·푸시할 경우 키 전체 재발급이 필요합니다.
# ============================================================================
spring:
  datasource:
    hikari:
      # 로컬 개발에서 DB connection을 너무 많이 만들지 않도록 최대 connection 수를 제한합니다.
      maximum-pool-size: 10
      # 요청이 적을 때도 바로 사용할 수 있도록 최소 idle connection을 유지합니다.
      minimum-idle: 2
      # DB 접속 문제가 있을 때 오래 기다리지 않고 빠르게 실패하게 합니다.
      connection-timeout: 10000

  jpa:
    # 실행 SQL을 콘솔에 출력하는 개발 편의 설정입니다.
    # 운영 공통 설정에는 넣지 않고 local profile에만 둡니다.
    show-sql: true
    properties:
      hibernate:
        # 콘솔 SQL을 읽기 좋게 줄바꿈/들여쓰기 합니다.
        format_sql: true

  data:
    redis:
      # Redis 연결 URL입니다. Slice 04/07에서 rate limit과 분산 락에 사용합니다.
      url: ${REDIS_URL:redis://localhost:6379}

# 외부 API 인증키 설정입니다.
# 실제 값은 .env 또는 실행 환경변수로만 주입하고 Git에는 올리지 않습니다.
external:
  mfds:
    # 식약처 API 키입니다. Slice 01에서 의약품 허가정보와 낱알식별 정보를 조회할 때 사용합니다.
    api-key: ${MFDS_API_KEY:}
  hira:
    # HIRA API 키입니다. Slice 02/05/08에서 DUR, 질병, 병원/약국 데이터 조회에 사용합니다.
    api-key: ${HIRA_API_KEY:}
  kma:
    # 기상청 API 키입니다. Slice 07에서 단기예보 조회에 사용합니다.
    api-key: ${KMA_API_KEY:}
  gemini:
    # Gemini API 키입니다. Slice 03에서 LLM 기반 NB 추출에 사용합니다.
    api-key: ${GEMINI_API_KEY:}
    # 기본 Gemini 모델입니다. 모델 교체가 필요하면 환경변수만 바꾸면 됩니다.
    model: ${GEMINI_MODEL:gemini-2.5-flash-lite}
    # prompt/schema 변경 이력을 추적하기 위한 기본 버전입니다.
    prompt-version: ${GEMINI_PROMPT_VERSION:v1}

app:
  # pgcrypto 컬럼 암호화에 사용할 애플리케이션 마스터키입니다.
  # 실제 값은 .env에만 보관하고, 코드나 문서에 노출하지 않습니다.
  encryption-key: ${APP_ENCRYPTION_KEY:}

logging:
  level:
    # local profile에서만 Hibernate SQL 로그를 자세히 봅니다.
    org.hibernate.SQL: DEBUG
