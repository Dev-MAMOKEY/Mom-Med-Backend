spring:
  application:
    # 로그, Swagger 문서, 관측성 도구에서 이 백엔드 서비스를 구분할 때 쓰는 이름입니다.
    name: mom-med-backend

  profiles:
    # 별도 지정이 없으면 local profile로 실행합니다.
    # 운영/CI에서는 SPRING_PROFILES_ACTIVE로 원하는 profile을 명시하면 됩니다.
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # 애플리케이션 DB 접속 URL입니다.
    # 현재 프로젝트에서는 .env의 DB_URL을 표준으로 사용합니다.
    # 이전에 쓰던 DATABASE_URL이 남아 있는 팀원 환경도 깨지지 않도록 fallback을 둡니다.
    url: ${DB_URL:${DATABASE_URL}}
    # 애플리케이션 DB 접속 계정입니다. .env의 DB_USER를 우선 사용합니다.
    username: ${DB_USER:${POSTGRES_USER}}
    # 애플리케이션 DB 접속 비밀번호입니다. 실제 값은 .env에만 두고 Git에는 올리지 않습니다.
    password: ${DB_PASSWORD:${POSTGRES_PASSWORD}}
    # PostgreSQL JDBC driver를 명시해 datasource 자동 구성을 안정적으로 만듭니다.
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # DB schema는 Flyway가 관리합니다.
      # Hibernate가 테이블을 자동 생성/수정하지 않고 Entity와 DB 구조가 맞는지만 검증합니다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # DB 시간대와 애플리케이션 기본 시간대를 맞춰 created_at/updated_at 혼선을 줄입니다.
          time_zone: Asia/Seoul
    # 요청이 끝난 뒤에도 DB session이 오래 열려 있는 문제를 막습니다.
    open-in-view: false

  flyway:
    # 애플리케이션 시작 시 db/migration 아래 SQL을 버전 순서대로 자동 실행합니다.
    enabled: true
    # Flyway가 읽을 마이그레이션 파일 위치입니다.
    locations: classpath:db/migration
    # 빈 DB를 기준으로 관리하므로 기존 schema를 임의로 baseline 처리하지 않습니다.
    baseline-on-migrate: false
    # 이미 적용된 SQL이 수정되었는지 checksum으로 검증합니다.
    # 한 번 커밋된 V 파일은 수정하지 말고 V2, V3처럼 새 파일을 추가해야 합니다.
    validate-on-migrate: true
    # flyway_schema_history 테이블을 app schema에 둡니다.
    default-schema: app
    # 프로젝트에서 사용하는 4개 schema입니다. Flyway가 존재 여부를 보장합니다.
    schemas: app,ref,derived,logs
    # 빈 DB에서 schema가 없으면 Flyway가 먼저 생성합니다.
    create-schemas: true

server:
  # 로컬과 기본 실행 환경에서 사용할 HTTP 포트입니다.
  port: 8080

app:
  push:
    firebase:
      # Firebase 서비스 계정 JSON 파일 경로입니다. 미설정 시 FCM 로그 모드로 동작합니다.
      service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
  scheduler:
    weather-push:
      # 날씨 푸시 스케줄러 cron 표현식입니다. "-"로 설정하면 비활성화됩니다.
      cron: ${WEATHER_PUSH_CRON:0 30 5 * * *}
  etl:
    weather:
      rules:
        # true로 켜면 애플리케이션 시작 시 seed/weather_rules_v0.2.json을 ref.weather_rules에 upsert합니다.
        enabled: ${WEATHER_RULES_LOAD_ENABLED:false}
        path: ${WEATHER_RULES_SEED_PATH:seed/weather_rules_v0.2.json}
        version: ${WEATHER_RULES_VERSION:v0.2}
      region-grid:
        # true로 켜면 기상청 격자 xlsx를 ref.region_grid에 upsert합니다. 파일은 로컬에만 두고 Git에 올리지 않습니다.
        enabled: ${REGION_GRID_LOAD_ENABLED:false}
        path: ${REGION_GRID_XLSX_PATH:기상청41_단기예보 조회서비스_오픈API활용가이드_2510/기상청41_단기예보 조회서비스_오픈API활용가이드_격자_위경도(2510).xlsx}
        # Apache POI의 zip bomb 오탐 방지 기준입니다. 기상청 xlsx styles.xml이 기본값 0.01에 걸릴 수 있어 0.001을 기본으로 둡니다.
        min-inflate-ratio: ${REGION_GRID_MIN_INFLATE_RATIO:0.001}

springdoc:
  api-docs:
    # OpenAPI JSON 문서 경로입니다.
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI 접속 경로입니다.
    path: /swagger-ui.html

logging:
  level:
    # 공통 로그는 과도하게 자세하지 않게 두고, local profile에서 개발용 SQL 로그만 추가로 켭니다.
    org.springframework.web: INFO
    mamokey.mom_med: INFO
