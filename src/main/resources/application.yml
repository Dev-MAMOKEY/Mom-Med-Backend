spring:
  application:
    # 애플리케이션 이름입니다. 로그, Actuator, 관측 지표에서 서비스 식별자로 사용됩니다.
    name: mom-med-backend

  profiles:
    # 별도 지정이 없으면 local profile로 실행합니다.
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    # Spring Boot가 PostgreSQL에 접속할 JDBC URL입니다. 실제 값은 .env 또는 실행 환경변수로 주입합니다.
    url: ${DATABASE_URL}
    # PostgreSQL 접속 계정입니다. Docker Compose의 POSTGRES_USER와 같은 값을 사용합니다.
    username: ${POSTGRES_USER}
    # PostgreSQL 접속 비밀번호입니다. 실제 값은 절대 Git에 커밋하지 않습니다.
    password: ${POSTGRES_PASSWORD}
    # PostgreSQL JDBC 드라이버를 명시해 datasource 자동 구성을 안정화합니다.
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      # Flyway가 schema를 관리하므로 Hibernate는 DDL을 생성하지 않고 매핑 검증만 수행합니다.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          # DB 저장/조회 시각 기준을 서비스 기본 시간대에 맞춥니다.
          time_zone: Asia/Seoul
    # 요청 처리 중 지연 로딩으로 DB 세션이 오래 열리는 것을 막습니다.
    open-in-view: false

server:
  # 로컬 및 기본 실행 포트입니다.
  port: 8080

springdoc:
  api-docs:
    # OpenAPI JSON 문서 경로입니다.
    path: /v3/api-docs
  swagger-ui:
    # Swagger UI 접근 경로입니다.
    path: /swagger-ui.html

logging:
  level:
    # 공통 로그는 과하게 자세하지 않게 두고, local profile에서 개발용 SQL 로그를 켭니다.
    org.springframework.web: INFO
    mamokey.mom_med: INFO
