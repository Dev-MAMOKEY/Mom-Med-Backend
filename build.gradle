plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'mamokey.mom-med'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		// 프로젝트 전체가 같은 Java 버전으로 컴파일되도록 고정합니다.
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	// 모든 외부 라이브러리는 Maven Central에서 내려받습니다.
	mavenCentral()
}

dependencies {
	// 영속성 계층: JPA 리포지토리, Flyway 마이그레이션, PostgreSQL 연결 드라이버입니다.
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// 캐시/분산 제어: Redis 접근과 Redisson 기반 락 구현에 사용합니다.
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'org.redisson:redisson-spring-boot-starter:4.3.1'

	// 요청 제한: 외부 API 호출량 제어와 rate limit 구현에 사용할 Bucket4j 코어입니다.
	implementation 'com.bucket4j:bucket4j-core:8.10.1'

	// API 계층: MVC 엔드포인트, 입력값 검증, Swagger/OpenAPI 문서 UI를 제공합니다.
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.2'

	// Slice 06: 기상청 격자 좌표 xlsx를 읽어 ref.region_grid에 적재하기 위한 Excel 파서입니다.
	implementation 'org.apache.poi:poi-ooxml:5.4.1'

	// Slice 07: Firebase Admin SDK — FCM 푸시 알림 발송에 사용합니다.
	implementation 'com.google.firebase:firebase-admin:9.4.3'

	// 객체 매핑: DTO와 Entity 변환 코드를 컴파일 시점에 생성합니다.
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	// Lombok: getter, 생성자 등 반복 코드를 줄이기 위한 컴파일 보조 도구입니다.
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Spring Boot 테스트: validation, MVC, ApplicationContext 검증에 필요한 테스트 도구입니다.
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'

	// Testcontainers: 실제 PostgreSQL 컨테이너를 띄워 통합 테스트할 때 사용합니다.
	testImplementation platform('org.testcontainers:testcontainers-bom:1.20.6')
	testImplementation 'org.testcontainers:junit-jupiter'
	testImplementation 'org.testcontainers:postgresql'

	// 테스트 컴파일 보조: 테스트 코드에서도 Lombok annotation processing을 사용할 수 있게 합니다.
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(JavaCompile).configureEach {
	// 한글 주석과 테스트 문자열이 Windows 환경에서도 깨지지 않도록 컴파일 인코딩을 고정합니다.
	options.encoding = 'UTF-8'
}

tasks.named('test') {
	// JUnit 5 기반 테스트를 실행합니다.
	useJUnitPlatform()
}
